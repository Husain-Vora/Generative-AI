[project]
name = "generative-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Husain-Vora", email = "husain.vora.0192@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "langchain",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mistralai>=1.1.6",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "lxml>=6.1.3",
    "mistralai>=3.7.0",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pandas>=3.1.1",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
    "unstructured>=0.27.37",
    "uvicorn>=0.54.0",
]

[project.scripts]
generative-ai = "generative_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
